<div class="container">
    <h1 class="mt-3">Edit Blogpost</h1>
    <ng-container *ngIf="model">
        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2 mb-5">
                <div class="mt-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" id="title" [(ngModel)]="model.title">
                </div>
                <div class="mt-3">
                    <label for="urlHanle" class="form-label">Url Handle</label>
                    <input type="text" class="form-control" name="urlHandle" id="urlHandle"
                        [(ngModel)]="model.urlHandle">
                </div>
                <div class="mt-3">
                    <label for="shortDescription" class="form-label">Short Description</label>
                    <input type="text" class="form-control" name="shortDescription" id="shortDescription"
                        [(ngModel)]="model.shortDescription">
                </div>
                <div class="mt-3">
                    <label for="content" class="form-label">Content</label>
                    <div class="d-flex flex-row">
                        <div class="col-6 p-2">
                            <textarea class="form-control" name="content" id="content"
                                style="height: 350px; max-height:350px" [(ngModel)]="model.content">
                        </textarea>
                        </div>
                        <div class="col-6 p-2" style="max-height:350px; overflow-y:scroll">
                            <markdown [data]="model.content"></markdown>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <label for="featuredImageUrl" class="form-label">Featured Image URL</label>
                    <button type="button" class="btn btn-light" (click)="openImageSelector()">Select Image</button>
                    <ng-container *ngIf="model.featuredImageURl !== ''">
                        <div>
                            <img [src]="model.featuredImageURl" height="100px" class="my-2">
                        </div>
                    </ng-container>

                    <input type="text" class="form-control" name="featuredImageUrl" id="featuredImageUrl"
                        [(ngModel)]="model.featuredImageURl">
                </div>
                <div class="mt-3">
                    <label for="publishedDate" class="form-label">Published Date</label>
                    <input type="date" class="form-control" name="publishedDate" id="publishedDate"
                        value="{{model.publishedDate}}" [ngModel]="model.publishedDate | date:'yyyy-MM-dd'"
                        (ngModelChange)="model.publishedDate = $event">
                </div>
                <div class="mt-3">
                    <label for="author" class="form-label">Author</label>
                    <input type="text" class="form-control" name="author" id="author" [(ngModel)]="model.author">
                </div>
                <div class="form-check mt-3">
                    <label class="form-check-label" for="isVisible">Is Visible?</label>
                    <input class="form-check-input" type="checkbox" name="isVisible" id="isVisible"
                        [(ngModel)]="model.isVisible">
                </div>
                <div class="mt-3">
                    <label class="form-label" for="categories">Categories</label>
                    <ng-container *ngIf="categories$ | async as categories">
                        <select class="form-control" name="categories" id="categories" [(ngModel)]="selectedCategories"
                            multiple>
                            <option *ngFor="let category of categories" [value]="category.id">{{category.name}}
                            </option>
                        </select>
                    </ng-container>

                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-danger ms-3" (click)="onDelete()">Delete</button>
                </div>

            </div>


        </form>

    </ng-container>
</div>

<div class="images-container-model" [ngClass]="{'d-block': isImageSelectorVisible, 'd-none': !isImageSelectorVisible}">
    <button type="button" class="btn btn-light" style="position: fixed; top: 10px; right: 10px" (click)="closeImageSelector()">X</button>
    <app-image-selector></app-image-selector>
</div>
